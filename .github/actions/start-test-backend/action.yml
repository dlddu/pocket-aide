name: Start the test backend
description: >
  Starts prebuilt cmd/oidcmock + cmd/server binaries (bin_dir/oidcmock,
  bin_dir/pocket-aide — ci.yml's ios-test-backend job cross-compiles them
  for macOS; android-instrumented-test.yml builds them for its runner)
  in the background together with the local GitHub API stub
  (github_api_stub.py), the fake APNs receiver (apns_receiver.py) and the
  fake FCM receiver (fcm_receiver.py), and exports OIDCMOCK_PID /
  BACKEND_PID / GITHUB_STUB_PID / APNS_RECEIVER_PID / FCM_RECEIVER_PID via
  $GITHUB_ENV so a later step can kill them. The backend log goes to
  /tmp/pocket-aide-backend.log. Assumes the caller already
  checked out the repo. Required env vars on the calling
  job (read by the binaries themselves, not this action):
    OIDC_ISSUER, OIDC_AUDIENCE, OIDC_CLIENT_ID, OIDC_REDIRECT_URI,
    DATABASE_PATH, PORT.

inputs:
  bin_dir:
    description: Directory holding the oidcmock and pocket-aide binaries built for this runner.
    required: true
  oidcmock_port:
    description: Port the oidcmock server listens on.
    required: false
    default: '5556'
  backend_port:
    description: Port the backend server listens on. Must match $PORT.
    required: false
    default: '8080'
  github_stub_port:
    description: >
      Port the GitHub API stub listens on. Must match the
      GITHUB_API_BASE_URL that PRMonitorUITests passes to the app.
    required: false
    default: '5557'
  apns_receiver_port:
    description: >
      Port the fake APNs receiver listens on. Must match the APNS_HOST
      the backend sends to and the port WebhookPushSettingsUITests reads.
    required: false
    default: '5558'
  fcm_receiver_port:
    description: >
      Port the fake FCM receiver listens on. Must match the FCM_HOST and the
      service account token_uri the backend uses, and the port the Android
      instrumented tests read.
    required: false
    default: '5559'

runs:
  using: composite
  steps:
    - name: Make the backend binaries executable
      shell: bash
      run: chmod +x "${{ inputs.bin_dir }}/oidcmock" "${{ inputs.bin_dir }}/pocket-aide"
    # mock-exception: EXT — 실 OIDC IdP(브라우저 동의·실 계정)는 CI 안에서 못 띄운다; oidcmock 이 대신한다 (docs/e2e-mocking-policy.md)
    - name: Start oidcmock
      shell: bash
      run: |
        "${{ inputs.bin_dir }}/oidcmock" -addr :${{ inputs.oidcmock_port }} \
          -client-id pocket-aide-ios-dev -audience pocket-aide-dev &
        echo "OIDCMOCK_PID=$!" >> "$GITHUB_ENV"
        for i in {1..30}; do
          curl -fsS http://localhost:${{ inputs.oidcmock_port }}/.well-known/openid-configuration && break || sleep 1
        done
    # mock-exception: EXT — APNs 발송은 Apple 인증키·실 기기 토큰 경계라 CI 안에서 못 한다; 백엔드가 APNS_HOST 로 보내는 요청을 로컬 가짜 수신부가 받아 기록한다 (docs/e2e-mocking-policy.md)
    - name: Start fake APNs receiver
      shell: bash
      run: |
        python3 "${{ github.action_path }}/apns_receiver.py" ${{ inputs.apns_receiver_port }} > /tmp/apns-receiver.log 2>&1 &
        echo "APNS_RECEIVER_PID=$!" >> "$GITHUB_ENV"
        for i in {1..30}; do
          curl -fsS http://localhost:${{ inputs.apns_receiver_port }}/healthz && break || sleep 1
        done
    # mock-exception: EXT — FCM 발송은 Firebase 서비스 계정 키·실 기기 등록 토큰 경계라 CI 안에서 못 한다; 백엔드가 FCM_HOST 와 일회용 서비스 계정 token_uri 로 보내는 요청을 로컬 가짜 수신부가 받아 기록한다 (docs/e2e-mocking-policy.md)
    - name: Start fake FCM receiver
      shell: bash
      run: |
        python3 "${{ github.action_path }}/fcm_receiver.py" ${{ inputs.fcm_receiver_port }} > /tmp/fcm-receiver.log 2>&1 &
        echo "FCM_RECEIVER_PID=$!" >> "$GITHUB_ENV"
        for i in {1..30}; do
          curl -fsS http://localhost:${{ inputs.fcm_receiver_port }}/healthz && break || sleep 1
        done
    - name: Start backend
      shell: bash
      run: |
        "${{ inputs.bin_dir }}/pocket-aide" > /tmp/pocket-aide-backend.log 2>&1 &
        echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
        for i in {1..30}; do
          curl -fsS http://localhost:${{ inputs.backend_port }}/healthz && break || sleep 1
        done
    # mock-exception: EXT — 실 GitHub 은 전용 테스트 계정 PAT 가 CI 시크릿에 없어 E2E 가 부를 수 없다; 앱이 부르는 GitHub API 를 로컬 스텁이 대신한다 (docs/e2e-mocking-policy.md)
    - name: Start GitHub API stub
      shell: bash
      run: |
        python3 "${{ github.action_path }}/github_api_stub.py" ${{ inputs.github_stub_port }} > /tmp/github-stub.log 2>&1 &
        echo "GITHUB_STUB_PID=$!" >> "$GITHUB_ENV"
        for i in {1..30}; do
          curl -fsS -H 'Authorization: Bearer ghp_e2e_valid' http://localhost:${{ inputs.github_stub_port }}/user && break || sleep 1
        done
