name: Android tests

on:
  workflow_call:

jobs:
  android:
    name: Android build + test
    # aapt2 from Google Maven ships no linux-arm64 build, so this job cannot use the arm runners.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit test, lint
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
