name: Journey mockup

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: journey-mockup
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/journey-mockup-harness/package-lock.json
      - run: npm ci --prefix tools/journey-mockup-harness
      - run: node tools/journey-mockup-harness/check.mjs
