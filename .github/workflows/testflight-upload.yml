name: TestFlight upload

# Reads signing material and the App Store Connect key straight from secrets
# without declaring them, so callers must pass `secrets: inherit`.

on:
  workflow_call:
    inputs:
      preview_pr:
        description: PR number whose preview backend to target. Empty = production.
        type: string
        default: ''
      build_source:
        description: Short origin label shown in the TestFlight "What to Test" note.
        type: string
        default: ''

jobs:
  upload:
    name: Build & upload to TestFlight
    runs-on: macos-26
    env:
      APP_BUNDLE_ID: com.dlddu.PocketAide
      BUILD_SOURCE: ${{ inputs.build_source }}
      # Build (and label the note with) the PR head, not refs/pull/N/merge, so
      # the app matches the commit the preview backend runs.
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ios
          bundler-cache: true
      - uses: ./.github/actions/install-ios-signing
        with:
          cert_p12_base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          cert_password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          profile_main_base64: ${{ secrets.IOS_PROVISIONING_PROFILE_MAIN_BASE64 }}
          profile_keyboard_base64: ${{ secrets.IOS_PROVISIONING_PROFILE_KEYBOARD_BASE64 }}
          profile_widget_base64: ${{ secrets.IOS_PROVISIONING_PROFILE_WIDGET_BASE64 }}
      - name: Generate Xcode project
        uses: ./.github/actions/generate-xcode-project
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      - name: Inject BackendBaseURL
        working-directory: ios
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          PREVIEW_PR: ${{ inputs.preview_pr }}
        run: |
          set -euo pipefail
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "Missing repository variable: BACKEND_BASE_URL" >&2
            exit 1
          fi
          if [ -n "$PREVIEW_PR" ]; then
            case "$PREVIEW_PR" in *[!0-9]*) echo "preview_pr must be a number: $PREVIEW_PR" >&2; exit 1;; esac
            case "$BACKEND_BASE_URL" in
              https://pocket-aide.*) ;;
              *) echo "BACKEND_BASE_URL must start with https://pocket-aide. to derive the preview host" >&2; exit 1;;
            esac
            BACKEND_BASE_URL="https://pocket-aide-pr-${PREVIEW_PR}.${BACKEND_BASE_URL#https://pocket-aide.}"
          fi
          echo "BackendBaseURL=$BACKEND_BASE_URL"
          /usr/libexec/PlistBuddy -c "Set :BackendBaseURL $BACKEND_BASE_URL" PocketAide/Info-Release.plist
          /usr/libexec/PlistBuddy -c "Set :BackendBaseURL $BACKEND_BASE_URL" PocketAideWidget/Info-Release.plist
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}.p8
      - name: Run fastlane beta
        working-directory: ios
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: bundle exec fastlane beta
