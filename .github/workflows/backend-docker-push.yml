name: Backend Docker build + push

# Builds the backend container image and pushes it to GHCR. Tags both
# `:latest` and `:${{ github.sha }}` so deployments can pin to an exact
# commit. Reusable workflow — caller decides when to invoke (gated on
# backend code changes + green tests in ci.yml).

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Build & push image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/dlddu/pocket-aide:latest
            ghcr.io/dlddu/pocket-aide:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
