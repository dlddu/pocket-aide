name: Backend Docker build + push

# Called from ci.yml and preview.yml. A called workflow sees its caller's github
# context, so the event/ref conditions below behave the same from either caller.

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Build & push image
    runs-on: ubuntu-24.04-arm
    steps:
      # On pull_request the default ref is refs/pull/N/merge (a temporary merge
      # commit), whose content would not match the head-SHA tag. Build exactly
      # the commit the tag names.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/dlddu/pocket-aide:${{ github.event.pull_request.head.sha || github.sha }}
          labels: |
            org.opencontainers.image.title=pocket-aide
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  pin:
    name: Pin deployment image (main only)
    needs: [push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Use the commit that was just built as deploy's parent, not main's HEAD.
      # Full history feeds the 「has a newer commit already been published」
      # ancestry check below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin k8s/deployment.yaml image to ${{ github.sha }}
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          f=k8s/deployment.yaml
          sed -i -E "s#(ghcr\.io/dlddu/pocket-aide):[A-Za-z0-9._-]+#\1:${SHA}#g" "$f"

          leftover=$(grep -oE "ghcr\.io/dlddu/pocket-aide:[A-Za-z0-9._-]+" "$f" \
                       | grep -v ":${SHA}\$" || true)
          if [ -n "$leftover" ]; then
            echo "::error::$f: unpinned image references remain:"
            echo "$leftover"
            exit 1
          fi
          n=$(grep -cE "ghcr\.io/dlddu/pocket-aide:${SHA}" "$f" || true)
          [ "$n" -ge 1 ] || { echo "::error::$f: no pinned reference found"; exit 1; }

          # A GITHUB_TOKEN push triggers no workflows and nothing listens on `deploy`
          # pushes, so publishing here cannot recurse.
          git fetch --no-tags origin +refs/heads/deploy:refs/remotes/origin/deploy 2>/dev/null || true
          old=$(git rev-parse -q --verify refs/remotes/origin/deploy || true)

          if [ -n "$old" ]; then
            cur=$(git log -1 --format='%(trailers:key=Source-Commit,valueonly)' "$old" | tr -d '[:space:]')
            if [ -n "$cur" ] && [ "$cur" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$cur" 2>/dev/null; then
              echo "deploy already points at a newer main commit (${cur}) — skipping."
              exit 0
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -a --allow-empty \
            -m "deploy: pin pocket-aide image to ${SHA}" \
            -m "Source-Commit: ${SHA}"

          # The lease fails the push if someone moved deploy after we read it
          # (an empty old value means the branch must not exist yet).
          git push --force-with-lease="refs/heads/deploy:${old}" origin HEAD:refs/heads/deploy
