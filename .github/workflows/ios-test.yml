name: iOS build + test

on:
  workflow_call:

jobs:
  ios:
    name: iOS build + test (shard ${{ strategy.job-index }})
    runs-on: macos-26
    # The UI suite runs serially in one simulator, so splitting its classes
    # across runners is what shortens the job. Each shard builds the app itself
    # (a few minutes) and gets its own backend and SQLite DB. Each shard holds
    # a macOS slot, and the account allows few at once, so mind the width.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      # mock-exception: EXT — 실 OIDC IdP(브라우저 동의·실 계정)는 CI 안에서 못 띄운다; oidcmock 이 대신한다 (docs/e2e-mocking-policy.md)
      OIDC_ISSUER: http://localhost:5556
      OIDC_AUDIENCE: pocket-aide-dev
      OIDC_CLIENT_ID: pocket-aide-ios-dev
      OIDC_REDIRECT_URI: pocketaide-dev://callback
      DATABASE_PATH: /tmp/pocket-aide-ci.db
      PORT: "8080"
      # Throwaway credentials: they only sign requests to the local SQS emulator
      # (start-test-sqs) and reach no AWS account.
      SQS_QUEUE_URL: http://localhost:4566/123456789012/pocket-aide-e2e
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # mock-exception: EXT — APNs 발송은 Apple 인증키·실 기기 토큰 경계라 CI 안에서 못 한다; 발송 대상만 로컬 가짜 수신부로 바꾸고 알림 설정 판정·발송 호출은 실경로 (docs/e2e-mocking-policy.md)
      APNS_HOST: http://localhost:5558
      APNS_KEY_ID: E2EKEY0001
      APNS_TEAM_ID: E2ETEAM001
      APNS_BUNDLE_ID: com.dlddu.PocketAide
    steps:
      - uses: actions/checkout@v4
      - name: Pick this shard's test classes
        id: shard
        run: python3 scripts/ci/ios_test_shards.py --index ${{ strategy.job-index }} --total ${{ strategy.job-total }}
      - uses: ./.github/actions/setup-go-backend
      - name: Generate a throwaway APNs signing key for the fake receiver
        run: |
          key=$(openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt)
          { echo 'APNS_AUTH_KEY_P8<<APNS_KEY_EOF'; echo "$key"; echo 'APNS_KEY_EOF'; } >> "$GITHUB_ENV"
      - uses: ./.github/actions/start-test-sqs
      - uses: ./.github/actions/start-test-backend
      - name: Enqueue webhook fixture after first sign-in
        # The consumer fans an event out to existing users only, and the
        # first user row appears when the UI tests sign in. Wait for it in
        # the background, then send the fixture the way the API Gateway
        # integration does: raw workflow_run body + x-github-event attribute.
        # PRMonitorUITests waits for the resulting history row.
        run: |
          (
            for i in $(seq 1 1800); do
              n=$(sqlite3 "$DATABASE_PATH" 'SELECT count(*) FROM users' 2>/dev/null || echo 0)
              [ "${n:-0}" -gt 0 ] && break
              sleep 1
            done
            curl -fsS "$SQS_QUEUE_URL" \
              --aws-sigv4 "aws:amz:$AWS_REGION:sqs" \
              --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
              --data-urlencode 'Action=SendMessage' \
              --data-urlencode 'MessageBody@.github/fixtures/github-webhook/workflow_run.completed.json' \
              --data-urlencode 'MessageAttribute.1.Name=x-github-event' \
              --data-urlencode 'MessageAttribute.1.Value.DataType=String' \
              --data-urlencode 'MessageAttribute.1.Value.StringValue=workflow_run'
          ) > /tmp/enqueue.log 2>&1 &
          echo "ENQUEUE_PID=$!" >> "$GITHUB_ENV"
      # mock-exception: EXT — APNs 전달(Apple 서버 → 기기)은 Apple 인증키·실 기기 토큰 경계라 CI 안에서 못 한다; 백엔드가 보낼 페이로드를 `xcrun simctl push` 로 시뮬레이터에 넣고 수신·탭 이후는 실경로 (docs/e2e-mocking-policy.md)
      - name: Deliver PR-monitor push to the simulator
        if: steps.shard.outputs.pr_monitor == 'true'
        # Push the payload the backend would send for the fixture's history row
        # (formatPushText title/body + SendWithData's event_id) only after
        # PRMonitorUITests logs "pocketaide-e2e push-ready" from the home screen:
        # a banner shown during another test can be tapped by it, which opens
        # the PR monitor under that test and used to end the pushes early. Each
        # ready line gets pushes until the app logs the deep-link highlight for
        # that id; the line is kept here because xcodebuild shuts the simulator
        # down when the tests end.
        run: |
          (
            until xcrun simctl list devices booted 2>/dev/null | grep -q '(Booted)'; do sleep 2; done
            xcrun simctl spawn booted log stream --style compact \
              --predicate 'eventMessage CONTAINS "pocketaide-e2e push-ready"' > /tmp/push-ready.log 2>&1 &
            id=''
            for i in $(seq 1 1800); do
              id=$(sqlite3 "$DATABASE_PATH" "SELECT id FROM notification_history WHERE repo_full_name = 'dlddu/pocket-aide-e2e' ORDER BY id LIMIT 1" 2>/dev/null || true)
              [ -n "$id" ] && break
              sleep 1
            done
            [ -n "$id" ] || { echo "no history row"; exit 1; }
            echo "$id" > /tmp/push-event-id
            printf '{"aps":{"alert":{"title":"%s","body":"%s"},"sound":"default"},"event_id":%s}\n' \
              'CI 통과 — dlddu/pocket-aide-e2e #9001' 'CI on e2e/bf-1-webhook' "$id" > /tmp/pr-monitor.apns
            handled=0
            while true; do
              ready=$(grep -cE 'push-ready [0-9A-F]{8}-' /tmp/push-ready.log || true)
              if [ "${ready:-0}" -le "$handled" ]; then sleep 2; continue; fi
              handled=$ready
              echo "push-ready #$ready"
              start=$(date +%s)
              while [ $(( $(date +%s) - start )) -lt 110 ]; do
                xcrun simctl push booted com.dlddu.PocketAide /tmp/pr-monitor.apns || true
                sleep 8
                if xcrun simctl spawn booted log show --last "$(( $(date +%s) - start + 5 ))s" --style compact \
                    --predicate 'process == "PocketAide"' 2>/dev/null \
                    | grep -w "highlightedEventID=$id" >> /tmp/push-highlight.log; then
                  echo "delivered event_id=$id"
                  break
                fi
              done
            done
          ) > /tmp/push.log 2>&1 &
          echo "PUSH_PID=$!" >> "$GITHUB_ENV"
      # mock-exception: EXT — APNs 전달(Apple 서버 → 기기)은 Apple 인증키·실 기기 토큰 경계라 CI 안에서 못 한다; 테스트가 고른 시점에 넣은 `dlddu/push-e2e-` 이벤트마다 백엔드가 보낼 페이로드를 `xcrun simctl push` 로 시뮬레이터에 넣고 수신·탭 이후는 실경로 (docs/e2e-mocking-policy.md)
      - name: Deliver pushes for test-sent push-e2e events
        run: |
          (
            tab="$(printf '\t')"
            seen=0
            for i in $(seq 1 7200); do
              sqlite3 -separator "$tab" "$DATABASE_PATH" \
                "SELECT h.id, h.conclusion, h.repo_full_name, coalesce(h.pr_number, 0), h.workflow_name, h.head_branch
                 FROM notification_history h JOIN users u ON u.id = h.user_id
                 WHERE u.oidc_sub = 'mock-user-123' AND h.repo_full_name LIKE 'dlddu/push-e2e-%' AND h.id > $seen
                 ORDER BY h.id" > /tmp/push-relay.rows 2>/dev/null || true
              while IFS="$tab" read -r id conclusion repo number workflow branch; do
                [ -n "$id" ] || continue
                case "$conclusion" in
                  success) verdict='CI 통과' ;;
                  failure) verdict='CI 실패' ;;
                  *) verdict="CI $conclusion" ;;
                esac
                title="$repo — $conclusion"
                [ "$number" -gt 0 ] && title="$verdict — $repo #$number"
                data=",\"event_id\":$id"
                case "$repo" in dlddu/push-e2e-noid-*) data='' ;; esac
                printf '{"aps":{"alert":{"title":"%s","body":"%s on %s"},"sound":"default"}%s}\n' \
                  "$title" "$workflow" "$branch" "$data" > /tmp/push-relay.apns
                xcrun simctl push booted com.dlddu.PocketAide /tmp/push-relay.apns || break
                echo "pushed id=$id $(cat /tmp/push-relay.apns)"
                seen=$id
              done < /tmp/push-relay.rows
              sleep 1
            done
          ) > /tmp/push-relay.log 2>&1 &
          echo "PUSH_RELAY_PID=$!" >> "$GITHUB_ENV"
      - name: Cut the Open-Meteo route while a test asks for it (network-cut / network-restore log lines)
        if: steps.shard.outputs.pr_monitor == 'true'
        run: |
          (
            set +e
            cut_route() {
              ips=$(python3 -c 'import socket; print(" ".join(sorted({a[4][0] for a in socket.getaddrinfo("api.open-meteo.com", 443, proto=socket.IPPROTO_TCP)})))')
              { cat /etc/pf.conf; echo "block return out quick from any to { $ips }"; } > /tmp/pf-cut.conf
              sudo pfctl -f /tmp/pf-cut.conf
              token=$(sudo pfctl -E 2>&1 | sed -n 's/^Token : //p')
              for ip in $ips; do
                case "$ip" in *:*) any='::/0' ;; *) any='0.0.0.0/0' ;; esac
                sudo pfctl -k "$any" -k "$ip" || true
              done
              printf '127.0.0.1 api.open-meteo.com\n::1 api.open-meteo.com\n' | sudo tee -a /etc/hosts > /dev/null
              sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
              echo "cut $(date +%T) ips=$ips token=$token"
            }
            restore_route() {
              sudo sed -i '' '/ api\.open-meteo\.com$/d' /etc/hosts
              sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
              sudo pfctl -f /etc/pf.conf
              [ -n "$token" ] && sudo pfctl -X "$token" || true
              token=''
              echo "restored $(date +%T)"
            }
            until xcrun simctl list devices booted 2>/dev/null | grep -q '(Booted)'; do sleep 2; done
            xcrun simctl spawn booted log stream --style compact \
              --predicate 'eventMessage CONTAINS "pocketaide-e2e network-"' > /tmp/network-switch.log 2>&1 &
            state=restore; token=''; cut_at=0; handled=0
            while true; do
              lines=$(grep -cE 'network-(cut|restore) [0-9A-F]{8}-' /tmp/network-switch.log || true)
              if [ "${lines:-0}" -gt "$handled" ]; then
                handled=$lines
                want=$(grep -oE 'network-(cut|restore) [0-9A-F]{8}-' /tmp/network-switch.log | tail -n 1 | cut -d' ' -f1)
                if [ "$want" = network-cut ] && [ "$state" != cut ]; then
                  cut_route; state=cut; cut_at=$(date +%s)
                elif [ "$want" = network-restore ] && [ "$state" = cut ]; then
                  restore_route; state=restore
                fi
              elif [ "$state" = cut ] && [ $(( $(date +%s) - cut_at )) -gt 180 ]; then
                echo "cut held over 180s"; restore_route; state=restore
              fi
              sleep 1
            done
          ) > /tmp/network-cut.log 2>&1 &
          echo "NETWORK_CUT_PID=$!" >> "$GITHUB_ENV"
      - uses: ./.github/actions/generate-xcode-project
      - name: SwiftLint
        if: strategy.job-index == 0
        working-directory: ios
        run: |
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint --strict --reporter github-actions-logging
      - name: Resolve Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Build & test (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          # -retry-tests-on-failure + -test-iterations 2 absorbs environment-
          # induced flakes (e.g. "Failed to get background assertion", UI
          # query snapshot timeouts on a loaded simulator): each failing test is re-run once.
          # Coverage stays on in the scheme for local runs; nothing in CI reads it.
          xcodebuild \
            -project PocketAide.xcodeproj \
            -scheme PocketAide \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -enableCodeCoverage NO \
            ${{ steps.shard.outputs.only_testing }} \
            test | xcbeautify
      - name: Verify push tap reached the deep-link highlight
        if: steps.shard.outputs.pr_monitor == 'true'
        # The tap itself is asserted by PRMonitorUITests; the highlighted
        # event id is only observable in the app's log, saved by the push step.
        run: |
          id=$(cat /tmp/push-event-id)
          grep -w "highlightedEventID=$id" /tmp/push-highlight.log
      - name: Dump PR-monitor pipeline logs on failure
        if: failure()
        run: |
          echo '--- enqueue ---'; cat /tmp/enqueue.log || true
          echo '--- push ---'; cat /tmp/push.log || true
          echo '--- push-ready ---'; cat /tmp/push-ready.log || true
          echo '--- push relay ---'; cat /tmp/push-relay.log || true
          echo '--- network cut ---'; cat /tmp/network-cut.log || true; cat /tmp/network-switch.log || true
          echo '--- moto ---'; tail -n 100 /tmp/moto.log || true
          echo '--- github stub ---'; tail -n 100 /tmp/github-stub.log || true
          echo '--- apns receiver ---'; tail -n 100 /tmp/apns-receiver.log || true
      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-result-bundle-${{ strategy.job-index }}
          path: ios/TestResults.xcresult
          retention-days: 7
      - name: Stop background processes
        if: always()
        run: |
          [ -n "${OIDCMOCK_PID:-}" ] && kill ${OIDCMOCK_PID} || true
          [ -n "${BACKEND_PID:-}" ] && kill ${BACKEND_PID} || true
          [ -n "${MOTO_PID:-}" ] && kill ${MOTO_PID} || true
          [ -n "${GITHUB_STUB_PID:-}" ] && kill ${GITHUB_STUB_PID} || true
          [ -n "${APNS_RECEIVER_PID:-}" ] && kill ${APNS_RECEIVER_PID} || true
          [ -n "${ENQUEUE_PID:-}" ] && kill ${ENQUEUE_PID} || true
          [ -n "${PUSH_PID:-}" ] && kill ${PUSH_PID} || true
          pkill -f 'pocketaide-e2e push-ready' || true
          [ -n "${PUSH_RELAY_PID:-}" ] && kill ${PUSH_RELAY_PID} || true
          [ -n "${NETWORK_CUT_PID:-}" ] && kill ${NETWORK_CUT_PID} || true
          pkill -f 'pocketaide-e2e network-' || true
          sudo sed -i '' '/ api\.open-meteo\.com$/d' /etc/hosts || true
