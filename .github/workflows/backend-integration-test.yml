name: Backend integration tests

on:
  workflow_call:

jobs:
  integration:
    name: Backend integration (LocalStack)
    runs-on: ubuntu-24.04-arm
    services:
      localstack:
        # Pinned to a pre-license-gate community release. The rolling
        # `:latest` tag now resolves to a Pro build that exits early
        # without LOCALSTACK_AUTH_TOKEN, even for OSS services like SQS.
        # 3.8.1 still works for community SQS without auth.
        image: localstack/localstack:3.8.1
        ports:
          - 4566:4566
        env:
          SERVICES: sqs
          DEBUG: "0"
    defaults:
      run:
        working-directory: backend
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go-backend
      - uses: ./.github/actions/wait-for-localstack
      - name: Integration tests
        run: go test -tags=integration -race -count=1 ./internal/githubwebhook/...
