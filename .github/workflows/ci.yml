name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - '.dockerignore'
            ios:
              - 'ios/**'
            code:
              - 'backend/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'ios/**'
              - '.github/workflows/ci.yml'
              - 'k8s/**'

  backend-test:
    name: Backend test + lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: backend

  ios-test:
    name: iOS build + test
    needs: backend-test
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    env:
      OIDC_ISSUER: http://localhost:5556
      OIDC_AUDIENCE: pocket-aide-dev
      OIDC_CLIENT_ID: pocket-aide-ios-dev
      OIDC_REDIRECT_URI: pocketaide-dev://callback
      OPENROUTER_API_KEY: test-key-not-used
      LANGFUSE_PUBLIC_KEY: test
      LANGFUSE_SECRET_KEY: test
      LANGFUSE_HOST: http://localhost:0
      DATABASE_PATH: /tmp/pocket-aide-ci.db
      PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum
      - name: Build backend binaries
        working-directory: backend
        run: |
          go build -o /tmp/oidcmock ./cmd/oidcmock
          go build -o /tmp/pocket-aide ./cmd/server
      - name: Start oidcmock
        run: |
          /tmp/oidcmock -addr :5556 -client-id pocket-aide-ios-dev -audience pocket-aide-dev &
          echo "OIDCMOCK_PID=$!" >> $GITHUB_ENV
          for i in {1..30}; do
            curl -fsS http://localhost:5556/.well-known/openid-configuration && break || sleep 1
          done
      - name: Start backend
        run: |
          /tmp/pocket-aide &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          for i in {1..30}; do
            curl -fsS http://localhost:8080/healthz && break || sleep 1
          done
      - uses: irgaly/setup-mint@v1
      - name: Generate Xcode project
        working-directory: ios
        run: |
          mint install yonaskolb/xcodegen
          mint run xcodegen generate
      - name: SwiftLint
        working-directory: ios
        run: |
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint --strict --reporter github-actions-logging
      - name: Resolve Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Build & test (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketAide.xcodeproj \
            -scheme PocketAide \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            test | xcbeautify
      - name: Stop background processes
        if: always()
        run: |
          [ -n "${OIDCMOCK_PID:-}" ] && kill ${OIDCMOCK_PID} || true
          [ -n "${BACKEND_PID:-}" ] && kill ${BACKEND_PID} || true

  backend-docker-push:
    name: Backend Docker build + push
    needs: ios-test
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/dlddu/pocket-aide:latest
            ghcr.io/dlddu/pocket-aide:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  testflight-upload:
    name: TestFlight upload
    needs: backend-docker-push
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.ios == 'true' && github.event_name == 'pull_request' }}
    runs-on: macos-26
    env:
      APP_BUNDLE_ID: com.dlddu.PocketAide
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ios
          bundler-cache: true
      - uses: irgaly/setup-mint@v1
      - name: Generate keychain password
        run: echo "KEYCHAIN_PASSWORD=$(openssl rand -base64 32)" >> $GITHUB_ENV
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          keychain-password: ${{ env.KEYCHAIN_PASSWORD }}
      - name: Install provisioning profiles
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          install_profile() {
            local data="$1" name_var="$2"
            local tmp
            tmp=$(mktemp)
            echo "$data" | base64 --decode > "$tmp"
            local plist
            plist=$(security cms -D -i "$tmp")
            local uuid name
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$plist")
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$plist")
            mv "$tmp" "$PROFILE_DIR/$uuid.mobileprovision"
            echo "${name_var}=${name}" >> "$GITHUB_ENV"
          }
          install_profile "${{ secrets.IOS_PROVISIONING_PROFILE_MAIN_BASE64 }}" PROFILE_NAME_MAIN
          install_profile "${{ secrets.IOS_PROVISIONING_PROFILE_KEYBOARD_BASE64 }}" PROFILE_NAME_KEYBOARD
          install_profile "${{ secrets.IOS_PROVISIONING_PROFILE_WIDGET_BASE64 }}" PROFILE_NAME_WIDGET
      - name: Generate Xcode project
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          mint install yonaskolb/xcodegen
          mint run xcodegen generate
      - name: Inject BackendBaseURL
        working-directory: ios
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "Missing repository variable: BACKEND_BASE_URL" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :BackendBaseURL $BACKEND_BASE_URL" PocketAide/Info-Release.plist
      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}.p8
      - name: Run fastlane beta
        working-directory: ios
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: bundle exec fastlane beta
      - name: Update TestFlight changelog
        working-directory: ios
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          TESTFLIGHT_CHANGELOG: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
        run: bundle exec fastlane update_changelog
      - name: Verify TestFlight changelog
        working-directory: ios
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          TESTFLIGHT_CHANGELOG: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
        run: bundle exec fastlane verify_changelog

  ci-success:
    name: ci-success
    needs: [changes, backend-test, ios-test, backend-docker-push, testflight-upload]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Verify required jobs succeeded or were correctly skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_TEST_RESULT: ${{ needs.backend-test.result }}
          IOS_TEST_RESULT: ${{ needs.ios-test.result }}
          BACKEND_PUSH_RESULT: ${{ needs.backend-docker-push.result }}
          TESTFLIGHT_RESULT: ${{ needs.testflight-upload.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
        run: |
          set -e
          echo "changes=$CHANGES_RESULT backend-test=$BACKEND_TEST_RESULT ios-test=$IOS_TEST_RESULT docker-push=$BACKEND_PUSH_RESULT testflight=$TESTFLIGHT_RESULT"
          [ "$CHANGES_RESULT" = "success" ] || { echo "changes job failed"; exit 1; }
          if [ "$CODE_CHANGED" = "true" ]; then
            [ "$BACKEND_TEST_RESULT" = "success" ] || { echo "backend-test must pass"; exit 1; }
            [ "$IOS_TEST_RESULT" = "success" ] || { echo "ios-test must pass"; exit 1; }
          fi
          if [ "$BACKEND_CHANGED" = "true" ]; then
            [ "$BACKEND_PUSH_RESULT" = "success" ] || { echo "backend-docker-push must pass"; exit 1; }
          fi
          if [ "$IOS_CHANGED" = "true" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            [ "$TESTFLIGHT_RESULT" = "success" ] || { echo "testflight-upload must pass"; exit 1; }
          fi
          echo "ci-success: all required gates green"
