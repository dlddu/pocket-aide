name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    outputs:
      backend_unit: ${{ steps.filter.outputs.backend_unit }}
      backend_integration: ${{ steps.filter.outputs.backend_integration }}
      ios_tests: ${{ steps.filter.outputs.ios_tests }}
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Each job has its own filter — paying for LocalStack on a pure
          # README change, or rebuilding Xcode on a backend-only PR, is not
          # free. Anchored to the reusable workflow + composite action
          # files so changes to CI plumbing always trigger the job they
          # affect. .github/workflows/ci.yml is included everywhere because
          # orchestrator edits (gate logic, filter rules) can silently
          # change which jobs run.
          filters: |
            backend_unit:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/backend-unit-test.yml'
              - '.github/actions/setup-go-backend/**'
            backend_integration:
              - 'backend/cmd/server/**'
              - 'backend/internal/githubwebhook/**'
              - 'backend/internal/devicetokens/**'
              - 'backend/internal/apns/**'
              - 'backend/internal/db/**'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - '.github/workflows/ci.yml'
              - '.github/workflows/backend-integration-test.yml'
              - '.github/actions/setup-go-backend/**'
              - '.github/actions/wait-for-localstack/**'
            ios_tests:
              - 'backend/**'
              - 'ios/Gemfile'
              - 'ios/project.yml'
              - 'ios/PocketAide/**'
              - 'ios/PocketAideKeyboard/**'
              - 'ios/PocketAideTests/**'
              - 'ios/PocketAideUnitTests/**'
              - 'ios/PocketAideWidget/**'
              - 'ios/Shared/**'
              - 'ios/fastlane/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ios-test.yml'
              - '.github/actions/setup-go-backend/**'
              - '.github/actions/start-test-backend/**'
              - '.github/actions/generate-xcode-project/**'
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/backend-docker-push.yml'
            ios:
              - 'ios/Gemfile'
              - 'ios/project.yml'
              - 'ios/PocketAide/**'
              - 'ios/PocketAideKeyboard/**'
              - 'ios/PocketAideTests/**'
              - 'ios/PocketAideUnitTests/**'
              - 'ios/PocketAideWidget/**'
              - 'ios/Shared/**'
              - 'ios/fastlane/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/testflight-upload.yml'
              - '.github/actions/install-ios-signing/**'
              - '.github/actions/generate-xcode-project/**'

  backend-unit-test:
    name: Backend unit + lint
    needs: changes
    if: needs.changes.outputs.backend_unit == 'true'
    uses: ./.github/workflows/backend-unit-test.yml

  backend-integration-test:
    name: Backend integration (LocalStack)
    needs: changes
    if: needs.changes.outputs.backend_integration == 'true'
    uses: ./.github/workflows/backend-integration-test.yml

  ios-test:
    name: iOS build + test
    needs: [changes, backend-unit-test, backend-integration-test]
    if: ${{ !cancelled() && needs.changes.outputs.ios_tests == 'true' && needs.backend-unit-test.result != 'failure' && needs.backend-integration-test.result != 'failure' }}
    uses: ./.github/workflows/ios-test.yml

  backend-docker-push:
    name: Backend Docker build + push
    needs: [changes, backend-unit-test, backend-integration-test, ios-test]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' && needs.backend-unit-test.result != 'failure' && needs.backend-integration-test.result != 'failure' && needs.ios-test.result != 'failure' }}
    uses: ./.github/workflows/backend-docker-push.yml

  testflight-upload:
    name: TestFlight upload
    needs: [changes, ios-test, backend-docker-push]
    if: ${{ !cancelled() && needs.changes.outputs.ios == 'true' && github.event_name == 'pull_request' && needs.ios-test.result == 'success' && needs.backend-docker-push.result != 'failure' }}
    uses: ./.github/workflows/testflight-upload.yml
    secrets: inherit

  ci-success:
    name: ci-success
    needs: [changes, backend-unit-test, backend-integration-test, ios-test, backend-docker-push, testflight-upload]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Verify required jobs succeeded or were correctly skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_UNIT_RESULT: ${{ needs.backend-unit-test.result }}
          BACKEND_INTEGRATION_RESULT: ${{ needs.backend-integration-test.result }}
          IOS_TEST_RESULT: ${{ needs.ios-test.result }}
          BACKEND_PUSH_RESULT: ${{ needs.backend-docker-push.result }}
          TESTFLIGHT_RESULT: ${{ needs.testflight-upload.result }}
          BACKEND_UNIT_CHANGED: ${{ needs.changes.outputs.backend_unit }}
          BACKEND_INTEGRATION_CHANGED: ${{ needs.changes.outputs.backend_integration }}
          IOS_TESTS_CHANGED: ${{ needs.changes.outputs.ios_tests }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
        run: |
          set -e
          echo "changes=$CHANGES_RESULT backend-unit=$BACKEND_UNIT_RESULT backend-integration=$BACKEND_INTEGRATION_RESULT ios-test=$IOS_TEST_RESULT docker-push=$BACKEND_PUSH_RESULT testflight=$TESTFLIGHT_RESULT"
          [ "$CHANGES_RESULT" = "success" ] || { echo "changes job failed"; exit 1; }
          if [ "$BACKEND_UNIT_CHANGED" = "true" ]; then
            [ "$BACKEND_UNIT_RESULT" = "success" ] || { echo "backend-unit-test must pass"; exit 1; }
          fi
          if [ "$BACKEND_INTEGRATION_CHANGED" = "true" ]; then
            [ "$BACKEND_INTEGRATION_RESULT" = "success" ] || { echo "backend-integration-test must pass"; exit 1; }
          fi
          if [ "$IOS_TESTS_CHANGED" = "true" ]; then
            [ "$IOS_TEST_RESULT" = "success" ] || { echo "ios-test must pass"; exit 1; }
          fi
          if [ "$BACKEND_CHANGED" = "true" ]; then
            [ "$BACKEND_PUSH_RESULT" = "success" ] || { echo "backend-docker-push must pass"; exit 1; }
          fi
          if [ "$IOS_CHANGED" = "true" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            [ "$TESTFLIGHT_RESULT" = "success" ] || { echo "testflight-upload must pass"; exit 1; }
          fi
          echo "ci-success: all required gates green"
