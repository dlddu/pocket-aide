<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>02 · AI 채팅 (음성) — PocketAide</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{font-family:'Apple SD Gothic Neo','SF Pro Text','-apple-system',BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
  .frame{width:393px;height:852px;border-radius:56px;background:#0F1614;box-shadow:0 30px 80px -20px rgba(0,0,0,.4),0 0 0 12px #0a0a0a,0 0 0 13px #2a2a2a;color:#E8EAE5}
  .island{width:118px;height:35px;border-radius:20px;background:#000}
  .home-bar{width:140px;height:5px;border-radius:3px;background:#fff}

  /* breathing orb */
  .orb{
    width:200px;height:200px;border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #9DBFAB 0%, #5E8B73 35%, #2D4A3A 75%, #1A2A23 100%);
    box-shadow:0 0 70px 4px rgba(94,139,115,.45), 0 0 130px 12px rgba(94,139,115,.2);
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }

  /* listening waveform */
  .wave{display:flex;align-items:center;gap:4px;justify-content:center}
  .wave span{display:block;width:4px;border-radius:2px;background:#9DBFAB}
  .wave span:nth-child(1){height:18px;animation:w1 1.1s ease-in-out infinite}
  .wave span:nth-child(2){height:32px;animation:w1 1.1s ease-in-out infinite .1s}
  .wave span:nth-child(3){height:44px;animation:w1 1.1s ease-in-out infinite .2s}
  .wave span:nth-child(4){height:28px;animation:w1 1.1s ease-in-out infinite .3s}
  .wave span:nth-child(5){height:38px;animation:w1 1.1s ease-in-out infinite .4s}
  .wave span:nth-child(6){height:22px;animation:w1 1.1s ease-in-out infinite .5s}
  .wave span:nth-child(7){height:30px;animation:w1 1.1s ease-in-out infinite .6s}
  @keyframes w1 { 0%,100%{transform:scaleY(.3);opacity:.6} 50%{transform:scaleY(1);opacity:1} }
</style>
</head>
<body class="bg-stone-200/70 min-h-screen flex flex-col items-center gap-5 py-8">

  <nav class="text-stone-700 text-sm flex items-center gap-2">
    <a href="index.html" class="underline underline-offset-4 decoration-stone-400 hover:text-stone-900">← 모든 목업</a>
    <span class="text-stone-400">/</span>
    <span>02 · AI 채팅 — 음성 모드</span>
  </nav>

  <div class="frame relative overflow-hidden">

    <!-- subtle grain -->
    <div class="absolute inset-0 opacity-[0.04] pointer-events-none" style="background-image:radial-gradient(circle at 20% 30%, #fff 0.5px, transparent 0.5px),radial-gradient(circle at 70% 60%, #fff 0.5px, transparent 0.5px);background-size:32px 32px,40px 40px"></div>

    <!-- status bar -->
    <div class="absolute top-0 inset-x-0 h-[54px] flex items-center justify-between px-9 z-30 text-[15px] font-semibold text-white/95">
      <span>9:41</span>
      <div class="island absolute left-1/2 -translate-x-1/2 top-3"></div>
      <div class="flex items-center gap-1.5">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="0.6"/><rect x="5" y="4" width="3" height="7" rx="0.6"/><rect x="10" y="2" width="3" height="9" rx="0.6"/><rect x="15" y="0" width="3" height="11" rx="0.6"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 2.5C9.7 2.5 11.3 3.1 12.5 4.3l1.4-1.4C12.3 1.3 10.2 0.5 8 0.5S3.7 1.3 2.1 2.9l1.4 1.4C4.7 3.1 6.3 2.5 8 2.5z"/><path d="M8 5.5c0.9 0 1.7 0.3 2.3 0.9l1.4-1.4C10.7 4.1 9.4 3.5 8 3.5s-2.7 0.6-3.7 1.5l1.4 1.4C6.3 5.8 7.1 5.5 8 5.5z"/><circle cx="8" cy="9" r="1.5"/></svg>
        <div class="flex items-center gap-0.5">
          <div class="w-[22px] h-[11px] rounded-[3px] border border-current relative"><div class="absolute inset-[1.5px] right-[5px] bg-current rounded-[1px]"></div></div>
          <div class="w-[1.5px] h-[4px] bg-current rounded-r"></div>
        </div>
      </div>
    </div>

    <!-- top bar -->
    <div class="absolute top-[54px] inset-x-0 px-5 pt-2 pb-3 flex items-center justify-between z-20">
      <button class="px-3.5 py-1.5 rounded-full bg-white/10 border border-white/15 text-[13px] text-white/90 backdrop-blur">텍스트로</button>
      <div class="text-[11px] uppercase tracking-[0.18em] text-white/50 font-medium">핸즈프리</div>
      <button class="w-9 h-9 rounded-full bg-white/10 grid place-items-center text-white/90 backdrop-blur border border-white/15">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- main: orb + state -->
    <div class="absolute top-[170px] inset-x-0 flex flex-col items-center px-6 z-10">
      <div class="orb relative grid place-items-center">
        <div class="wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>

      <div class="mt-9 text-center">
        <div class="text-[12px] uppercase tracking-[0.22em] text-[#9DBFAB] font-semibold">듣고 있어요</div>
        <p class="mt-3 text-[19px] leading-snug text-white/95 font-medium max-w-[280px]">
          내일 회의 자료에 ARR 차트 추가하고, retention <span class="text-white/50">…</span>
        </p>
      </div>
    </div>

    <!-- session log preview (last exchange) -->
    <div class="absolute bottom-[210px] inset-x-0 px-7 z-10">
      <div class="rounded-[18px] bg-white/[0.06] border border-white/10 backdrop-blur px-4 py-3">
        <div class="text-[11px] tracking-wider text-white/40 mb-1">방금 전</div>
        <p class="text-[13.5px] text-white/80 leading-snug">"분기 리뷰 회의 준비 체크리스트 만들어둘게. 현재 4개 항목, 회사 투두로 보낼까요?"</p>
        <div class="text-[11px] text-[#9DBFAB] mt-1.5">— PocketAide</div>
      </div>
    </div>

    <!-- bottom controls -->
    <div class="absolute bottom-0 inset-x-0 pb-9 pt-5 px-8 z-20">
      <div class="flex items-center justify-between">
        <!-- mute -->
        <button class="w-14 h-14 rounded-full bg-white/[0.08] border border-white/10 grid place-items-center text-white/90 backdrop-blur">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><line x1="2" y1="2" x2="22" y2="22"/><path d="M9 4.5A3 3 0 0 1 15 5v6"/><path d="M15 12.5V13a3 3 0 0 1-5.7 1.3"/><path d="M5 11a7 7 0 0 0 12 5M19 11"/></svg>
        </button>

        <!-- end button -->
        <button class="w-[88px] h-[88px] rounded-full bg-[#C25450] grid place-items-center text-white shadow-[0_0_30px_rgba(194,84,80,.4)] active:scale-95 transition">
          <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>

        <!-- replay last -->
        <button class="w-14 h-14 rounded-full bg-white/[0.08] border border-white/10 grid place-items-center text-white/90 backdrop-blur">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>

      <div class="text-center mt-3 text-[11px] text-white/40 tracking-tight">
        말하면 응답이 즉시 중단됩니다 · 빨간 버튼으로 종료
      </div>
    </div>

    <!-- home indicator -->
    <div class="absolute bottom-2 left-1/2 -translate-x-1/2 z-30">
      <div class="home-bar"></div>
    </div>
  </div>

  <p class="text-stone-500 text-xs max-w-md text-center leading-relaxed">PRD-1 · AC2 음성 대화 모드 진입, AC3 한·영 혼용 인식 (실시간 STT 표시), AC5 TTS 인터럽트 — 발화 시작 시 응답 즉시 중단</p>
</body>
</html>
