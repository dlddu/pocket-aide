apiVersion: v1
kind: ConfigMap
metadata:
  name: pocket-aide-config
data:
  # Backend reads these at startup. Change OIDC settings here when the IdP
  # changes - iOS picks them up via /api/auth/config.
  PORT: "8080"
  DATABASE_PATH: "/data/pocket-aide.db"
  OIDC_ISSUER: "https://idp.example.com"
  OIDC_AUDIENCE: "pocket-aide-prod"
  OIDC_CLIENT_ID: "pocket-aide-ios"
  OIDC_REDIRECT_URI: "pocketaide://callback"
  LANGFUSE_HOST: "https://cloud.langfuse.com"

  # PR-monitor pipeline (GitHub webhooks → SQS → APNs). Backend skips the
  # whole consumer when SQS_QUEUE_URL is empty, so leaving the placeholder is
  # safe for any environment that doesn't run the feature yet.
  AWS_REGION: "ap-northeast-2"
  SQS_QUEUE_URL: ""
  APNS_KEY_ID: "REPLACE_ME"
  APNS_TEAM_ID: "REPLACE_ME"
  APNS_BUNDLE_ID: "com.dlddu.PocketAide"
  APNS_USE_PRODUCTION: "true"
