# Replace this manifest with the secret-management pattern your cluster uses
# (SealedSecrets, SOPS, External Secrets Operator). The plain Secret below is a
# placeholder so the Deployment's envFrom resolves and so the manifest set is
# self-contained for `kubectl apply -k --dry-run`.
#
# DO NOT commit real secret values. The values shown here are dummy stubs.
apiVersion: v1
kind: Secret
metadata:
  name: pocket-aide-secrets
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_ME"
  LANGFUSE_PUBLIC_KEY: "REPLACE_ME"
  LANGFUSE_SECRET_KEY: "REPLACE_ME"

  # PR-monitor secrets. Required only when SQS_QUEUE_URL is set in the
  # ConfigMap; the backend's loadConfig fast-fails if missing.
  #
  # GitHub webhooks now arrive via a public API Gateway → SQS proxy. GitHub's
  # HMAC (x-hub-signature-256) is forwarded as a message attribute for
  # authenticity, but the consumer does not yet verify it (see runbook §3/§8),
  # so no GITHUB_WEBHOOK_SECRET is wired here yet.
  APNS_AUTH_KEY_P8: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
