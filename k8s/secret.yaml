# Reference-only. This file is NOT listed in kustomization.yaml, so it is not
# applied by `kubectl apply -k` or by Flux. It documents the key set the
# Deployment's envFrom expects; replace it with whatever secret-management
# pattern your cluster uses (SealedSecrets, SOPS, External Secrets Operator).
#
# In the dlddu cluster the `pocket-aide-secrets` Secret is created by the
# ExternalSecret in dlddu/flux-cd-apps (apps/pocket-aide/external-secret.yaml)
# from SSM. Do not add this file back to kustomization.yaml — doing so lets
# Flux overwrite the real Secret with the stubs below.
#
# DO NOT commit real secret values. The values shown here are dummy stubs.
apiVersion: v1
kind: Secret
metadata:
  name: pocket-aide-secrets
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_ME"
  LANGFUSE_PUBLIC_KEY: "REPLACE_ME"
  LANGFUSE_SECRET_KEY: "REPLACE_ME"

  # PR-monitor secrets. Required only when SQS_QUEUE_URL is set in the
  # ConfigMap; the backend's loadConfig fast-fails if missing.
  #
  # GitHub webhooks arrive via API Gateway → ingress SQS → a verifier Lambda
  # (checks x-hub-signature-256) → the consumer SQS. The Lambda is the only
  # producer on the consumer queue, so the backend trusts its input and needs
  # no GitHub webhook secret here (see runbook §3).
  APNS_AUTH_KEY_P8: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
