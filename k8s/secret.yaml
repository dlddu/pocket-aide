# Reference-only: kustomization.yaml does not list this file (the reason is
# there), so neither `kubectl apply -k` nor Flux applies it. It documents the
# key sets the Deployment's envFrom expects: secrets here, and the non-secret
# operator values in the pocket-aide-ssm-config ConfigMap below.
# DO NOT commit real secret values. The values shown here are dummy stubs.
apiVersion: v1
kind: Secret
metadata:
  name: pocket-aide-secrets
type: Opaque
stringData:
  OPENROUTER_API_KEY: "REPLACE_ME"
  LANGFUSE_PUBLIC_KEY: "REPLACE_ME"
  LANGFUSE_SECRET_KEY: "REPLACE_ME"

  APNS_AUTH_KEY_P8: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----

  FCM_SERVICE_ACCOUNT_JSON: |
    {"type": "service_account", "project_id": "REPLACE_ME", "private_key": "REPLACE_ME", "client_email": "REPLACE_ME"}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pocket-aide-ssm-config
data:
  # PR-monitor (empty SQS_QUEUE_URL disables the whole pipeline)
  AWS_REGION: "ap-northeast-2"
  AWS_ROLE_ARN: ""
  SQS_QUEUE_URL: ""
  # APNs identifiers (the .p8 key itself stays in the Secret)
  APNS_KEY_ID: "REPLACE_ME"
  APNS_TEAM_ID: "REPLACE_ME"
  APNS_BUNDLE_ID: "com.dlddu.PocketAide"
  APNS_USE_PRODUCTION: "true"
