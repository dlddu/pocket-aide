apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-aide
# secret.yaml is intentionally NOT listed. In the Flux-managed cluster the
# `pocket-aide-secrets` Secret is owned by the ExternalSecret in dlddu/flux-cd-apps
# (apps/pocket-aide/external-secret.yaml); building the placeholder here lets
# Flux (prune + force) overwrite it with dummy stubs and silently disable pr-monitor.
resources:
  - configmap.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
