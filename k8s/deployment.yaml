apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-aide
  labels:
    app: pocket-aide
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocket-aide
  template:
    metadata:
      labels:
        app: pocket-aide
    spec:
      containers:
        - name: pocket-aide
          # The tag on main is only a placeholder. Production tracks the `deploy`
          # branch, where CI's `pin` job (backend-docker-push.yml) rewrites this
          # line to the main commit SHA; PR previews retag it to the PR head SHA
          # (flux-cd-apps apps/pocket-aide-preview). Tags are immutable, so the
          # default IfNotPresent is correct. Keep no `images:` transformer in
          # kustomization.yaml — this line is the single source of the tag.
          image: ghcr.io/dlddu/pocket-aide:dd069899e13d7e88434cc0deabf7ba19c3142f31
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pocket-aide-config
            - secretRef:
                name: pocket-aide-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-aide
