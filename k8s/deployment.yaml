apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-aide
  labels:
    app: pocket-aide
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocket-aide
  template:
    metadata:
      labels:
        app: pocket-aide
    spec:
      serviceAccountName: pocket-aide
      containers:
        - name: pocket-aide
          # The tag on main is a placeholder: CI's `pin` job rewrites it on the `deploy`
          # branch (docs/runbook-deploy-and-preview.md). Keep no `images:` transformer in
          # kustomization.yaml — it would override the pinned tag.
          image: ghcr.io/dlddu/pocket-aide:dd069899e13d7e88434cc0deabf7ba19c3142f31
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.alloy.svc.cluster.local:4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE)
          envFrom:
            # Later sources win: repo defaults/placeholders, then the operator's
            # non-secret values from SSM (PR-monitor region/role/SQS URL, APNs
            # key/team/bundle ids), then the actual secrets (APNs .p8, FCM JSON).
            - configMapRef:
                name: pocket-aide-config
            - configMapRef:
                name: pocket-aide-ssm-config
            - secretRef:
                name: pocket-aide-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-aide
